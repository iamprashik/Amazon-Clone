<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <!-- First header -->
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>
            
            <div class="nav_address border">
                <p class="add-first">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">Canada</p>
                </div>
            </div>
            <div class="nav-search ">
                <select class="select-search">
                    <option> All</option>
                </select>
                <input type="text" placeholder="Search Amazon" class="input-search">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            
            
            <div class="nav-sign border">
                <p><span>Hello, Sign in</span></p>
                <div class="account">
                <p class="nav-second"> Account & Lists </p>
                <select><option></option></select> 
                </div>
            </div>

            <div class="nav-return border">
                <p><span>Returns</span></p>
                <p class="nav-second"> & Orders </p>
                
            </div>

            <div class="nav-cart border">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
            </div>
            </div>

            <!-- Second header -->
            <div class="panel ">
                <div class="panel-all border">
                    <i class="fa-solid fa-bars"></i>
                    All
                </div>
                <div class="panel-items">
                    <p class="border">Today's Deals</p>
                    <p class="border">Amazon Pay</p>
                    <p class="border">Best Sellers</p>
                    <p class="border">Mobiles</p>
                    <p class="border">Customer Service</p>
                </div>
                <div class="panel-deals border">
                    <p> Shop deals in Electronics </p>
                </div>
            </div>
        
    </header>
</body>
</html>
